<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookie — JEE Inorganic Chemistry Question Bank</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="theme-dark">
  <div id="app">
    <!-- Top Navigation Header -->
    <header class="navbar">
      <div class="nav-left">
        <button id="sidebarToggle" class="icon-btn" aria-label="Toggle sidebar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="logo">
          <span class="logo-badge">JEE</span>
          <span class="logo-title">Bookie</span>
          <span class="logo-sub">Inorganic Chemistry</span>
        </div>
      </div>

      <div class="nav-center">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search questions, reactions, NCERT quotes...">
          <button id="clearSearch" class="clear-btn" style="display: none;">&times;</button>
        </div>
      </div>

      <div class="nav-right">
        <div class="stats-pill" id="globalStats">
          <span class="stats-label">Mastery:</span>
          <span class="stats-val" id="masteryText">0 / 1349 (0%)</span>
        </div>

        <button id="themeToggle" class="icon-btn" aria-label="Toggle light/dark theme" title="Toggle theme">
          <span class="theme-icon">🌙</span>
        </button>
      </div>
    </header>

    <div class="layout">
      <!-- Left Sidebar: Topic and Section Selector -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h3>Syllabus Explorer</h3>
          <span class="total-q-badge" id="totalQuestionsBadge">1349 Qs</span>
        </div>

        <!-- Filter Controls -->
        <div class="sidebar-section">
          <label class="filter-label">Filter Question Type</label>
          <select id="typeFilter" class="custom-select">
            <option value="all">All Question Formats</option>
            <option value="statement_pair">Statement I / II</option>
            <option value="assertion_reason">Assertion-Reason</option>
            <option value="match_column">Match the Column</option>
            <option value="single_mcq">Single Choice MCQ</option>
            <option value="integer_type">Integer / Numerical</option>
            <option value="fill_blanks">Reactions & Fill-in</option>
            <option value="bonus">NCERT Line Audit</option>
          </select>
        </div>

        <div class="sidebar-section">
          <label class="filter-label">Status Filter</label>
          <div class="status-chips">
            <button class="chip active" data-status="all">All</button>
            <button class="chip" data-status="unattempted">Unattempted</button>
            <button class="chip" data-status="correct">Correct</button>
            <button class="chip" data-status="incorrect">Review</button>
            <button class="chip" data-status="bookmarked">★ Starred</button>
          </div>
        </div>

        <!-- Hierarchy Navigation -->
        <div class="tree-nav" id="treeNav">
          <!-- Populated dynamically by app.js -->
        </div>

        <div class="sidebar-footer">
          <button id="resetProgressBtn" class="secondary-btn small-btn">Reset Progress</button>
        </div>
      </aside>

      <!-- Main Question Viewing Area -->
      <main class="content-area" id="contentArea">
        <!-- Section Header Bar -->
        <div class="section-banner">
          <div class="banner-info">
            <div class="breadcrumbs" id="breadcrumbs">
              <span class="crumb-topic">Hydrogen</span>
              <span class="crumb-sep">›</span>
              <span class="crumb-sec">All Sections</span>
            </div>
            <h1 class="current-title" id="currentSectionTitle">Loading Questions...</h1>
            <p class="current-ncert" id="currentNcertRange"></p>
          </div>

          <div class="banner-actions">
            <div class="progress-container">
              <div class="progress-bar">
                <div class="progress-fill" id="sectionProgressFill" style="width: 0%;"></div>
              </div>
              <span class="progress-label" id="sectionProgressLabel">0% Completed</span>
            </div>

            <div class="action-buttons">
              <button id="toggleAllAnswersBtn" class="secondary-btn">Show All Answers</button>
            </div>
          </div>
        </div>

        <!-- Questions List Container -->
        <div class="questions-list" id="questionsList">
          <!-- Question cards dynamically injected here -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
          <div class="empty-icon">🔍</div>
          <h3>No questions match your current filter</h3>
          <p>Try resetting the status filter, question type, or search query.</p>
          <button id="resetFiltersBtn" class="primary-btn">Clear Filters</button>
        </div>
      </main>
    </div>
  </div>

  <!-- Offline Standalone Data Source Fallback -->
  <script src="questions-data.js"></script>
  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
